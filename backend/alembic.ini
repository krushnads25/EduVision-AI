[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
qualname = root
level = WARN
handlers = console

[logger_sqlalchemy]
qualname = sqlalchemy
level = WARN
handlers = console

[logger_alembic]
qualname = alembic
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic:env]
# place holder
